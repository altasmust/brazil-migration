<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aydınlatma metni</title>
<style>
:root{--brand:#1b5e20;--bg:#f4f7f2;--ink:#17261b;--mute:#68776b;--line:#d7dfd2}
*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:780px;margin:0 auto;padding:18px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 14px}.top b{font-size:19px;color:var(--brand)}
.lang{display:flex;gap:6px}.lang button{font:inherit;font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:#fff;cursor:pointer}.lang button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.card{background:#fff;border:1px solid #e3e9de;border-radius:18px;padding:22px 22px;box-shadow:0 6px 24px rgba(23,38,27,.06)}
h1{font-size:24px;margin:0 0 4px}h2{font-size:17px;margin:22px 0 6px;color:var(--brand)}p,li{margin:6px 0}ul{padding-left:20px}.mute{color:var(--mute);font-size:13.5px}.disc{margin-top:22px;font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:12px}
.links{margin-top:16px;display:flex;gap:14px;flex-wrap:wrap;font-size:14px}a{color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b id="firm"></b><div class="lang"><button data-l="tr">TR</button><button data-l="en">EN</button><button data-l="pt">PT</button></div></div>
  <div class="card" id="doc"><p class="mute">…</p></div>
  <div class="links"><a href="/verilerim/" id="mydata">Verilerim ve gizlilik</a><a href="/cerez-politikasi/">Çerez politikası</a></div>
</div>
<script>
(function(){
  var L=['tr','en','pt'],cur=(new URLSearchParams(location.search).get('lang')||(navigator.language||'tr').slice(0,2)).toLowerCase();if(L.indexOf(cur)<0)cur='tr';
  var ML={tr:'Verilerim ve gizlilik',en:'My data & privacy',pt:'Meus dados e privacidade'};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function draw(d){
    document.documentElement.lang=d.lang;document.title=d.title+' — '+d.firm;document.getElementById('firm').textContent=d.firm;document.getElementById('mydata').textContent=ML[d.lang]||ML.tr;
    var h='<h1>'+esc(d.title)+'</h1><p class="mute">'+esc(d.firm)+' · v'+esc(d.version)+'</p>';
    d.sections.forEach(function(s){h+='<h2>'+esc(s.h)+'</h2>';(s.p||[]).forEach(function(t){h+='<p>'+esc(t)+'</p>'});if(s.list&&s.list.length)h+='<ul>'+s.list.map(function(t){return'<li>'+esc(t)+'</li>'}).join('')+'</ul>';(s.after||[]).forEach(function(t){h+='<p>'+esc(t)+'</p>'})});
    document.getElementById('doc').innerHTML=h;
    document.querySelectorAll('.lang button').forEach(function(b){b.classList.toggle('on',b.dataset.l===d.lang)});
  }
  function load(l){cur=l;fetch('/api/auth/privacy/notice?lang='+l,{cache:'no-store'}).then(function(r){return r.json()}).then(draw).catch(function(){document.getElementById('doc').innerHTML='<p>Metin yüklenemedi.</p>'})}
  document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){load(b.dataset.l)}});load(cur);
})();
</script>
</body>
</html>
